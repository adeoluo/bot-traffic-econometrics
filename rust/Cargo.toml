[package]
name = "bte-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust core of bot-traffic-econometrics: unbalanced-panel shift-share bootstrap, censored EM solver, and O(N) multivariate Hawkes MLE"
license = "MIT"
authors = ["Adeolu Ogunnoiki <adeoluo@hotmail.com>"]
repository = "https://github.com/adeoluo/bot-traffic-econometrics"
publish = false

[lib]
name = "_bte_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true, features = ["abi3-py312"] }
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
